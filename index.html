<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Condition Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg: #111; --panel: #1c1c1c; --fg: #eee; --muted: #999; --accent: #f28c28; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.7) contrast(0.9); }
  .card { position: absolute; z-index: 1000; background: var(--panel); padding: 12px 14px;
          border-radius: 8px; box-shadow: 0 2px 12px #0008; }
  #panel { top: 12px; left: 12px; min-width: 250px; }
  #acc { bottom: 24px; left: 12px; max-width: 300px; }
  #rank { top: 120px; right: 12px; width: 300px; max-height: calc(100% - 170px); overflow-y: auto; }
  #rank ol { margin: 0; padding: 0; list-style: none; }
  #rank li { padding: 6px 4px; border-top: 1px solid #333; cursor: pointer; line-height: 1.35; }
  #rank li:hover { background: #262626; }
  .pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; color: #111; font-weight: 600; }
  .clock { height: 4px; background: #333; border-radius: 2px; margin-top: 3px; }
  .clock div { height: 100%; border-radius: 2px; background: var(--accent); }
  .modal { display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px));
           max-height: 80%; overflow-y: auto; z-index: 1100; }
  .modal p { line-height: 1.5; }
  .modal ul { padding-left: 18px; margin: 4px 0; }
  .ghost { background: #2a2a2a; color: var(--fg); border: 1px solid #444; font-weight: 400; }
  a { color: var(--accent); }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 0 0 6px; }
  select, button { font: inherit; background: #2a2a2a; color: var(--fg); border: 1px solid #444;
                   border-radius: 4px; padding: 4px 8px; }
  button { background: var(--accent); color: #111; border: 0; font-weight: 600; cursor: pointer; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .stat, .note { color: var(--muted); line-height: 1.6; }
  .note { font-size: 12px; line-height: 1.4; margin-top: 6px; }
  .stat b, .note b { color: var(--fg); }
  .legend { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .ramp { flex: 1; height: 8px; border-radius: 4px; }
  .mark { width: 12px; height: 12px; background: var(--accent); transform: rotate(45deg); border: 2px solid #111; }
  .car { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
  table.cm { border-collapse: collapse; font-size: 11px; margin-top: 6px; }
  .cm td, .cm th { width: 20px; height: 18px; text-align: center; padding: 0; color: var(--fg); }
  .cm th { color: var(--muted); font-weight: 400; }
  #acc { max-height: calc(100% - 300px); overflow-y: auto; max-width: 340px; }
  table.models { border-collapse: collapse; font-size: 12px; width: 100%; }
  .models td, .models th { padding: 2px 4px; text-align: right; }
  .models td:first-child { text-align: left; }
  .models th { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel" class="card">
  <h1>Road Condition Map</h1>
  <div class="row"><select id="drive"></select><button id="play">Replay</button></div>
  <div class="row"><select id="mode"><option value="est">Estimated PASER</option><option value="rough">Roughness</option></select>
    <button id="briefBtn" class="ghost" hidden>Weekly brief</button>
    <button id="forecastBtn" class="ghost" hidden>Forecast</button></div>
  <div class="stat" id="stats"></div>
  <div class="legend" id="legend"></div>
</div>
<div id="acc" class="card"></div>
<div id="rank" class="card"></div>
<div id="brief" class="card modal"></div>
<div id="forecast" class="card modal"></div>
<div id="chat"></div>
<script>
const map = L.map('map', { preferCanvas: true }).setView([42.2, -83.3], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19, className: 'dark-tiles' }).addTo(map);

// Michigan's grouping: 8-10 good, 5-7 fair, 1-4 poor
const paserColor = p => p >= 8 ? '#2e9d4a' : p >= 5 ? '#e5b100' : '#d9342b';
const ramp = ['#3a7bd5', '#f5f5f5', '#f28c28', '#e0245e'];
const legends = {
  rough: `smooth <div class="ramp" style="background:linear-gradient(90deg,${ramp})"></div> rough`,
  est: `<div class="ramp" style="background:linear-gradient(90deg,#d9342b 0 33%,#e5b100 33% 66%,#2e9d4a 66%)"></div>
        <span>poor · fair · good</span>`,
};
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
let pct, driveLayer, timer;

function mix(a, b, f) {
  const n = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [n(a), n(b)];
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * f))})`;
}
function roughColor(r) {
  const [lo, , hi] = pct;
  const f = Math.min(Math.max((r - lo) / (hi - lo), 0), 1) * (ramp.length - 1);
  const i = Math.min(Math.floor(f), ramp.length - 2);
  return mix(ramp[i], ramp[i + 1], f - i);
}
const json = async url => (await fetch(url)).json();

async function init() {
  const index = await json('data/out/index.json');
  pct = index.rough_pct;
  const [segs, sections] = await Promise.all([json('data/out/segments.json'), json('data/out/sections.json')]);

  const paser = L.layerGroup(segs.map(s => L.polyline(s.coords, { color: paserColor(s.paser), weight: 2, opacity: 0.45 })
    .bindPopup(`<b>${esc(s.name)}</b><br>Rated PASER ${s.paser} (${s.evalyear})<br>${esc(s.surface)}`))).addTo(map);
  const est = L.layerGroup(sections.map(s => L.polyline(s.coords, { color: paserColor(s.est), weight: 7, opacity: 0.85 })
    .bindPopup(`<b>${esc(s.name)}</b><br>Estimated PASER <b>${s.est}</b>, rated ${s.paser}<br>
      ${s.n} windows over ${s.passes} pass${s.passes > 1 ? 'es' : ''}<br>
      median roughness ${s.rn} m/s² (normalized to 45 mph)`)));
  const ph = await json('data/out/potholes.json');
  const [confirmed, suspected] = potholeLayers(ph);
  const fc = await fetch('data/out/forecast.json').then(r => r.ok ? r.json() : null).catch(() => null);
  const overlays = { 'Rated PASER (SEMCOG)': paser, 'Estimated PASER by section': est,
    'Potholes (confirmed)': confirmed, 'Suspected (one pass)': suspected };
  if (fc) overlays[`Risk of poor by ${fc.forward.to}`] = forecastLayer(fc, segs);
  L.control.layers(null, overlays, { position: 'topright', collapsed: false }).addTo(map);

  renderAccuracy(index.accuracy);
  const chat = await fetch('data/out/webchat.json').then(r => r.ok ? r.json() : null).catch(() => null);
  if (chat) loadChat(chat);
  const models = await fetch('data/out/models.json').then(r => r.ok ? r.json() : null).catch(() => null);
  if (models) renderModels(models);
  const brief = await fetch('data/out/brief.json').then(r => r.ok ? r.json() : null).catch(() => null);
  if (brief) renderBrief(brief);
  const sel = document.getElementById('drive'), mode = document.getElementById('mode');
  sel.innerHTML = index.drives.map(d => `<option>${d}</option>`).join('');
  sel.onchange = mode.onchange = () => show(sel.value, false);
  document.getElementById('play').onclick = () => show(sel.value, true);
  show(index.drives[0], false);
}

const stateColor = { Suspected: '#888', Confirmed: '#f28c28', Worsening: '#e0245e', Repaired: '#2e9d4a', PatchFailed: '#a259ff' };
const pill = s => `<span class="pill" style="background:${stateColor[s]}">${s}</span>`;
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

function forecastLayer(fc, segs) {
  const b = fc.backtest, pct = x => `${Math.round(x * 100)}%`;
  const riskColor = r => mix('#3a3a3a', '#e0245e', Math.min(r / 0.6, 1));
  const layer = L.layerGroup(fc.forward.risk.map(([id, r]) => L.polyline(segs[id].coords,
    { color: riskColor(r), weight: 2 + 4 * Math.min(r / 0.6, 1), opacity: 0.9 })
    .bindPopup(`<b>${esc(segs[id].name)}</b><br>Rated PASER ${segs[id].paser} now<br>
      Chance of poor (1-4) by ${fc.forward.to}: <b>${pct(r)}</b>`)));
  const card = document.getElementById('forecast'), btn = document.getElementById('forecastBtn');
  card.innerHTML = `<h1>Which roads fall to poor next?</h1>
    <p>Backtest on SEMCOG's own history: the model saw ratings through ${b.origin} only. Of the ${pct(b.top_share)} of
    fair and good miles it flagged as most at risk, <b>${pct(b.top_hit)}</b> were rated poor by ${b.target},
    against ${pct(b.base_rate)} of all fair and good miles.</p>
    <h2>Forecasting every segment's ${b.target} rating, ${b.miles} miles</h2>
    <table class="models"><tr><th></th><th>within 1</th><th>MAE</th><th title="ranks roads that fell to poor above those that did not; 0.5 is a coin flip">falls to poor</th></tr>
    ${b.models.map(m => `<tr title="${esc(m.what)}"><td>${esc(m.name)}</td><td>${pct(m.within1)}</td><td>${m.mae}</td><td>${m.auc_fall}</td></tr>`).join('')}</table>
    <div class="note">Weighted by miles. Models learned from forecasts made in 2012, 2014 and 2016; none saw a rating after ${b.origin}.
      The map layer applies the same method from ${fc.forward.from} to ${fc.forward.to}.</div>
    <button class="ghost" id="forecastClose" style="margin-top:10px">Close</button>`;
  btn.hidden = false;
  btn.onclick = () => card.style.display = card.style.display === 'block' ? 'none' : 'block';
  document.getElementById('forecastClose').onclick = () => card.style.display = 'none';
  return layer;
}

let PH;
function potholeLayers(ph) {
  PH = ph;
  ph.potholes.forEach(p => potholesById[p.id] = p);
  const popup = p => `<b>${p.road ? esc(p.road) : 'Unrated road'}</b>${p.paser ? ` (PASER ${p.paser})` : ''}
    · <a href="#" onclick="workOrder(${p.id}); return false">Work order</a><br>
    ${pill(p.state)} severity ${p.severity} m/s², hit on ${p.hit_passes} of ${p.passes} passes<br>
    First seen ${fmtDate(p.first_seen)}: day ${p.days_open} of ${ph.clock_days}<br>
    <div class="note">${p.history.map(h => `${fmtDate(h.date)} ${h.hit ? `hit, ${h.severity}` : 'passed, no hit'}`).join('<br>')}</div>`;
  const layer = list => L.layerGroup(list.map(p => {
    p.marker = L.circleMarker([p.lat, p.lon], { radius: p.state === 'Suspected' ? 4 : 5 + Math.min(p.severity, 20) / 3,
      color: '#111', weight: 1.5, fillColor: stateColor[p.state], fillOpacity: 0.95 }).bindPopup(popup(p));
    return p.marker;
  }));
  const conf = ph.potholes.filter(p => p.state !== 'Suspected');
  const confirmed = layer(conf).addTo(map), suspected = layer(ph.potholes.filter(p => p.state === 'Suspected'));

  // ranked list: severity order; the clock is shown, not used to sort
  document.getElementById('rank').innerHTML = `<h2>Repair priority</h2>
    <div class="note">${conf.length} confirmed on 2+ passes, as of ${fmtDate(ph.as_of)}. Day 0 is the first detection.</div>
    <ol>${conf.slice(0, 25).map((p, i) => `<li data-i="${i}">
      <b>${i + 1}. ${p.road ? esc(p.road) : 'Unrated road'}</b> ${pill(p.state)}<br>
      <span class="stat">severity <b>${p.severity}</b> · ${p.hit_passes}/${p.passes} passes · day ${p.days_open} of ${ph.clock_days}</span>
      <div class="clock"><div style="width:${Math.min(100, 100 * p.days_open / ph.clock_days)}%"></div></div></li>`).join('')}</ol>`;
  document.querySelectorAll('#rank li').forEach(li => li.onclick = () => {
    const p = conf[li.dataset.i];
    map.setView([p.lat, p.lon], 17);
    p.marker.openPopup();
  });
  return [confirmed, suspected];
}

function renderBrief(b) {
  const card = document.getElementById('brief'), btn = document.getElementById('briefBtn');
  card.innerHTML = `<h1>Weekly brief</h1>
    ${b.brief ? `<p>${esc(b.brief)}</p>` : '<p class="note">No brief passed the number check; the facts below are the record.</p>'}
    <div class="note">Written by ${esc(b.model)} from the facts below, ${esc(b.generated)}.
      Checked: every number in it appears in the facts.</div>
    <h2 style="margin-top:12px">The record (computed, not generated)</h2>
    <ul class="note">${b.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
    <button class="ghost" id="briefClose">Close</button>`;
  btn.hidden = false;
  btn.onclick = () => card.style.display = card.style.display === 'block' ? 'none' : 'block';
  document.getElementById('briefClose').onclick = () => card.style.display = 'none';
}

const potholesById = {};
function workOrder(id) {
  const p = potholesById[id];
  const dir = ['northbound', 'eastbound', 'southbound', 'westbound'][Math.round(p.heading / 90) % 4];
  const left = PH.clock_days - p.days_open;
  const html = `<!doctype html><meta charset="utf-8"><title>Work order WO-${p.id}</title>
    <style>body{font:14px system-ui,sans-serif;max-width:640px;margin:32px auto;padding:0 16px}
    td{padding:4px 12px 4px 0;vertical-align:top}td:first-child{color:#666}table{border-collapse:collapse}</style>
    <h2>Work order WO-${p.id}</h2>
    <table>
      <tr><td>Road</td><td>${p.road ? esc(p.road) : 'Unrated road'}${p.paser ? ` (rated PASER ${p.paser})` : ''}, ${dir} lane</td></tr>
      <tr><td>Location</td><td>${p.lat}, ${p.lon} (<a href="https://www.google.com/maps?q=${p.lat},${p.lon}">map</a>)</td></tr>
      <tr><td>Status</td><td>${p.state}, hit on ${p.hit_passes} of ${p.passes} passes</td></tr>
      <tr><td>Severity</td><td>${p.severity} m/s² (speed-normalized peak)</td></tr>
      <tr><td>First detected</td><td>${fmtDate(p.first_seen)}: day ${p.days_open} of ${PH.clock_days}, ${left} days before the ${PH.clock_days}-day mark</td></tr>
      <tr><td>Pass history</td><td>${p.history.map(h => `${fmtDate(h.date)}: ${h.hit ? `hit, severity ${h.severity}` : 'passed, no hit'}`).join('<br>')}</td></tr>
      <tr><td>Action</td><td>Inspect and repair. Record the repair date and method.</td></tr>
    </table>
    <p style="color:#666;font-size:12px">Generated from fleet sensor data as of ${fmtDate(PH.as_of)}. The detection date is a
    best case: the defect may have existed before the fleet first hit it. Triage estimate, not a legal determination.</p>`;
  window.open(URL.createObjectURL(new Blob([html], { type: 'text/html' })));
}

// Road Desk agent (watsonx Orchestrate web chat); ids from orchestrate/webchat_config.py
function loadChat(c) {
  window.wxOConfiguration = { orchestrationID: c.orchestrationID, hostURL: c.hostURL, rootElementID: 'chat',
    showLauncher: true, chatOptions: { agentId: c.agentId, agentEnvironmentId: c.agentEnvironmentId } };
  const s = document.createElement('script');
  s.src = `${c.hostURL}/wxochat/wxoLoader.js?embed=true`;
  s.onload = () => wxoLoader.init();
  document.head.appendChild(s);
}

function renderModels(m) {
  const pct = x => `${Math.round(x * 100)}%`;
  document.getElementById('acc').insertAdjacentHTML('beforeend', `<h2 style="margin-top:12px">Every model, same ${m.test_sections} held-out sections</h2>
    <table class="models">${'<tr><th></th><th>within 1</th><th>MAE</th><th title="good vs poor: how often a PASER 8-10 section ranks above a 1-4 one">good/poor</th></tr>' +
    m.models.map(r => `<tr title="${esc(r.what)}"><td>${esc(r.name)}</td><td>${pct(r.within1)}</td><td>${r.mae}</td>
      <td>${r.auc_good_poor ?? '·'}</td></tr>`).join('')}</table>
    <div class="note">good/poor: chance a good section (${m.test_good}) scores better than a poor one (${m.test_poor}); 0.5 is a coin flip.</div>`);
}

function renderAccuracy(a) {
  const grid = Array.from({ length: 10 }, () => Array(10).fill(0));
  a.pairs.forEach(([p, e]) => grid[p - 1][e - 1]++);
  const max = Math.max(...grid.flat());
  const used = [...new Set(a.pairs.flat())].sort((x, y) => x - y);
  const rows = used.map(p => `<tr><th>${p}</th>${used.map(e => {
    const n = grid[p - 1][e - 1], near = Math.abs(p - e) <= 1;
    return `<td style="background:${n ? mix('#2a2a2a', near ? '#2e9d4a' : '#d9342b', 0.25 + 0.75 * n / max) : '#222'}">${n || ''}</td>`;
  }).join('')}</tr>`).join('');
  document.getElementById('acc').innerHTML = `<h2>Estimated vs. rated PASER</h2>
    <div class="note">Fitted on Sep 27-30 drives, scored on Oct 1 drives.<br>
    Within one grade on <b>${Math.round(a.within1 * 100)}%</b> of ${a.sections} half-mile sections
    (MAE ${a.mae}). Always guessing ${a.guess}: ${Math.round(a.guess_within1 * 100)}% (MAE ${a.guess_mae}).</div>
    <table class="cm"><tr><th></th>${used.map(e => `<th>${e}</th>`).join('')}</tr>${rows}</table>
    <div class="note">Rows: rated. Columns: estimated.</div>`;
}

async function show(id, animate) {
  clearInterval(timer);
  if (driveLayer) driveLayer.remove();
  const mode = document.getElementById('mode').value;
  document.getElementById('legend').innerHTML = legends[mode];
  const d = await json(`data/out/${id}.json`);
  driveLayer = L.layerGroup().addTo(map);
  L.polyline(d.track.map(p => [p[0], p[1]]), { color: '#666', weight: 2 }).addTo(driveLayer);
  if (!animate) map.fitBounds(d.track.map(p => [p[0], p[1]]), { padding: [40, 40] });

  const wins = d.windows.map(w => ({ t: w.t, w, layer: L.polyline(w.path,
    { color: mode === 'est' ? paserColor(w.est) : roughColor(w.rn), weight: 6 })
    .bindPopup(`<b>${w.name ? esc(w.name) : 'Unrated road'}</b><br>Estimated PASER <b>${w.est}</b>${w.paser ? `, rated ${w.paser}` : ''}<br>
      roughness ${w.rn} m/s² (normalized to 45 mph)<br>${(w.speed * 2.237).toFixed(0)} mph`) }));
  const hits = d.hits.map(h => ({ t: h.t, layer: L.circleMarker([h.lat, h.lon],
    { radius: 3 + Math.min(h.severity, 20) / 3, color: '#111', weight: 1, fillColor: '#fff', fillOpacity: 0.9 })
    .bindPopup(`<b>Severe hit</b><br>severity ${h.severity} m/s²<br>vertical ${h.vert}, lateral ${h.lat_g} m/s²<br>
      ${(h.speed * 2.237).toFixed(0)} mph`) }));
  const marks = d.markers.map(m => ({ t: m[2], layer: L.marker([m[0], m[1]],
    { icon: L.divIcon({ className: '', html: '<div class="mark"></div>', iconSize: [12, 12] }) })
    .bindPopup('Calibration mark') }));

  const t0 = d.track[0][2], t1 = d.track.at(-1)[2];
  const car = L.marker([d.track[0][0], d.track[0][1]],
    { icon: L.divIcon({ className: '', html: '<div class="car"></div>', iconSize: [14, 14] }) });

  function render(t) {
    for (const x of [...wins, ...hits, ...marks]) x.t <= t ? x.layer.addTo(driveLayer) : x.layer.remove();
    const seen = wins.filter(x => x.t <= t);
    const km = seen.length * 0.05, unrated = seen.filter(x => x.w.seg < 0).length * 0.05;
    document.getElementById('stats').innerHTML =
      `<b>${km.toFixed(1)} km</b> measured, <b>${unrated.toFixed(1)} km</b> unrated<br>` +
      `<b>${hits.filter(x => x.t <= t).length}</b> severe hits, <b>${marks.filter(x => x.t <= t).length}</b> calibration marks`;
  }

  if (!animate) return render(Infinity);
  car.addTo(driveLayer);
  const start = performance.now(), dur = 10000;
  timer = setInterval(() => {
    const f = Math.min((performance.now() - start) / dur, 1), t = t0 + f * (t1 - t0);
    const p = d.track.find(p => p[2] >= t) ?? d.track.at(-1);
    car.setLatLng([p[0], p[1]]);
    render(t);
    if (f === 1) clearInterval(timer);
  }, 50);
}
init();
</script>
</body>
</html>
